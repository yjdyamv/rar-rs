name: CI
env:
  DEBUG: napi:*
  APP_NAME: rar-rs-napi
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  # CI builds restore a target/ cache (see `rust-cache` in `check`/`test` and the
  # `actions/cache` steps in `build`), so incremental compilation buys nothing
  # and writes large, cache-hostile artifact trees; it is also off by default
  # for release builds. Keep it off everywhere.
  CARGO_INCREMENTAL: '0'
  # The two settings that make a failed run readable without re-running it:
  # colour is lost in a non-tty log unless forced, and a panic in a test
  # binary prints "note: run with RUST_BACKTRACE=1" instead of the stack.
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Static musl addons are cross-built with cargo-zigbuild, which needs a
  # `zig`. Pinned here (not by an action) and verified against the SHA-256
  # from ziglang.org's own index: the download stays on the official host,
  # and the checksum makes a corrupted or substituted tarball a hard error.
  # 0.16.0 is the current stable, validated locally by building the musl
  # addon and running the whole JS suite against it. (An earlier run of this
  # workflow failed *after* installing 0.16.0, which was a missing PATH export
  # in the installer, not the version.)
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  CARGO_ZIGBUILD_VERSION: '0.23.4'
  # Release-grade work — the binding matrix builds and rustdoc — runs on tags
  # and manual dispatches. A push/PR keeps only what catches a broken change
  # fast: `check` (fmt, the guards, clippy — which subsumes `cargo check` — and
  # cargo-deny) and `test` (the deterministic Rust test smoke).
  #
  # The rest of the test surface is a local gate (`cargo test --workspace
  # --all-features`, see docs/testing.md): the owner asked for that in 2026-09
  # after the WASI binding suite blocked a release on a non-reproducible
  # `memory access out of bounds`. The `test` job runs the Rust
  # unit/integration suites as a smoke (they caught a stale assertion that
  # shipped with 0.12.0); the JS/WASI binding suites stay local so a red run
  # stays a compile/lint/test-fact failure rather than a flake.
  #
  # Nothing is built twice on a heavy run: the binding's addons and its `tsc`
  # gate live in the `build`/`build-wasm` jobs, which already build them.
  #
  # Two release-grade *tests* ride along on that split instead of being dropped,
  # because dropping them would drop coverage rather than duplication: the
  # generated corpus against a scalar (`default = []`) build, and the same
  # corpus on Windows with `SA_REQUIRE_WINRAR=1`. Both are release-shaped — the
  # Linux one on `schedule` and tags, the Windows one on tags and dispatches —
  # because the Linux `test` job already runs those suites under `--all-features`
  # on every push, so what the extra step adds there is a second compile of the
  # crate plus every test binary.
  RUN_HEAVY: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
'on':
  # No `paths-ignore`. A markdown-only push is cheap enough to run `check`,
  # `test` and `msrv` for, and filtering by path broke two things that are
  # worse than those minutes: a tag whose diff happens to touch only `*.md`
  # would skip the workflow entirely and silently publish nothing, and a
  # docs-only PR would never post the checks branch protection waits for.
  # Formatting is a local convenience (`dprint`), not a second gate, so this
  # workflow is the only thing a docs-only change can trip.
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  # A plain dispatch builds the matrix (tag-only work) against the default
  # branch, which is how a workflow change is smoke-tested before it gates a
  # release. A dispatch that names an existing tag relays that tag's release:
  # the build jobs check the tag out, and `release` re-publishes it. Without
  # that input a release that died mid-upload could only be retried by
  # deleting and re-pushing the tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to (re)release, e.g. v0.15.0 (empty = plain build)'
        required: false
        type: string
  # RustSec advisories change without a commit. A weekly run re-evaluates the
  # committed lockfiles against the advisory database so a new advisory is
  # noticed here instead of on the next unrelated push. Only `check` and `test`
  # run: the heavy binding matrix stays tag/dispatch-only via `RUN_HEAVY`, and
  # the Windows jobs opt out of `schedule` too (the weekly run is advisories only).
  schedule:
    - cron: '0 4 * * 1'
# One run per ref. PR runs cancel their predecessor — a superseded commit is
# free to lose. Branch and tag runs queue instead: a cancelled tag run can
# leave a release with half its assets replaced, and the same group keeps a
# `release_tag` dispatch from racing the tag push it re-publishes (the dispatch
# runs on the default branch, so grouping by `github.ref` would separate them).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Least privilege: every job only reads the repository. `release` opts into
# `contents: write` for its own job; `publish` opts into `id-token: write` to
# exchange an OIDC token for a crates.io one (no stored secret).
permissions:
  contents: read

# The rar-rs workspace ships a pure-Rust library (crates/rar), CLI
# (crates/rar-cli) and the rar-rs-napi binding
# (crates/rar-napi, native .node + wasm32-wasip1-threads). No npm package
# is published: the VS Code consumer downloads the compiled artifacts from
# the GitHub Release assets (tag v*), SHA-256 pinned in its installer —
# every release ships a SHA-256SUMS manifest for that.
# The binding's JS tests run with `node --test` under crates/rar-napi; they are
# a local gate, like the Rust suites.
#
# Trigger split (see `RUN_HEAVY`): every push/PR runs `check`, `test`, the
# 32-bit `test-i686` and `msrv`; tags and manual dispatches additionally build
# the binding matrix and check rustdoc. The Windows `check-windows`/`test-windows`
# share those triggers and gate `release`, so a `#[cfg(windows)]` break cannot
# reach a published tag
# through the matrix. A weekly `schedule` reruns `check` because the RustSec
# advisory database moves without a commit.
# `release` (tags, or a dispatch naming a tag) assembles the GitHub Release
# from those artifacts.
#
# This file must live at the repository ROOT: GitHub Actions only executes
# .github/workflows/*.yml from the default branch root; the old copy under
# crates/rar-napi/.github/workflows/ was never run.
jobs:
  # Static gate: does the tree compile, format, lint and satisfy policy? Nothing
  # here runs a test suite — that is `test` — so a red run says which kind of
  # problem it is without reading the log.
  check:
    name: Checks (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # First, because it is the cheapest step and the only one that reads the
      # workflow files themselves. Pinned version and checksum: the download is
      # verified, so the tool cannot change under the gate.
      - name: Lint the workflow files (actionlint)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: bash scripts/ci/run-actionlint.sh
      # actionlint shellchecks the `run:` blocks in this file; this covers the
      # scripts those blocks call, which nothing else reads. `-S warning` is the
      # level where shellcheck finds defects instead of taste (at the default
      # style level it also flags deliberate constructs, e.g. the literal
      # backslash pattern in check-host-paths.sh). shellcheck ships on the ubuntu
      # image, and a missing binary is an error rather than a skip so the gate
      # cannot quietly disappear.
      - name: Lint the shell scripts (shellcheck)
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || {
            echo "::error::shellcheck is not on PATH (apt-get install -y shellcheck)"
            exit 1
          }
          shellcheck -S warning scripts/*.sh scripts/ci/*.sh scripts/wsl/*.sh
      - name: Rehearse the release payload (fixtures)
        # The `release` job's two scripts run here first, against fixtures built
        # in a temp directory: the addon/WASI completeness rules, the identical-
        # loader rule, the flattened-license collision rule and the release-notes
        # grouping all fail on a pull request instead of on a tag. Seconds, no
        # toolchain, and it covers the logic that used to be reachable only by
        # publishing.
        run: bash scripts/ci/test-release-scripts.sh
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads
      - name: Cache cargo
        # `check` compiles the workspace several times (clippy with all features
        # and targets, four isolated feature combinations, two fuzz builds).
        # Without a restored target/ every push pays the full cold build. The
        # cache key includes the rustc version, so a toolchain bump invalidates
        # it instead of mixing artifacts.
        #
        # `shared-key: linux` is shared with `test` on purpose: same toolchain,
        # same Cargo.lock, so the dependency graph and the downloaded registry
        # are identical. One entry means the second job of a run restores what
        # the first one saved instead of fetching and compiling its own copy;
        # GitHub refuses to overwrite an existing key, so the two cannot
        # actually corrupt each other — the loser simply keeps the winner's
        # artifacts. `msrv` stays separate because its key must follow a
        # different toolchain.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - name: Cargo fmt (workspace + fuzz)
        # `fuzz/` is not a workspace member, so `cargo fmt --all` never covers
        # its targets.
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Host-path separator guard
        # Host paths (disk, destination directory, volumes, -w/-op/--dest)
        # must test separators through `std::path::is_separator`, which is
        # platform-correct: `/` everywhere, `\` only on Windows. Archive-member
        # names may still normalize `\` -> `/` (RAR stores backslashes), so only
        # the method-on-char-literal shape is guarded.
        #
        # The check itself lives in the script so `scripts/ci-lint.sh` runs the
        # same grep instead of a hand-kept copy.
        run: bash scripts/ci/check-host-paths.sh
      - name: Workspace versions agree
        # The release job only compares the tag against `crates/rar-napi`, so the
        # library and CLI drifted (0.1.2 vs the binding's 0.7.0). Everything here
        # ships from one tree, so hold all five places to the same version. The
        # parsing lives in the script, shared with `release` and `ci-lint.sh`;
        # `release` passes the tag as an argument. Here it runs without one: the
        # five places must agree with each other, and `release` separately
        # proves they agree with the tag.
        run: bash scripts/ci/check-versions.sh
      - name: Crate license texts match the root copies
        # `cargo package` only ships files under the package directory, so each
        # crate carries a copy of `LICENSE`, `NOTICE`, `THIRD_PARTY_LICENSES.md`
        # and `LICENSES/`. Editing the root text and forgetting the copies
        # publishes a crate whose license declaration has no text behind it —
        # and crates.io cannot take a tarball back. The comparison lives in the
        # script so `scripts/ci-lint.sh` runs the same one.
        run: bash scripts/ci/check-crate-licenses.sh
      - name: Cargo check (rar-rs, wasm target, -D warnings)
        # The only `cargo check` left: clippy below already compiles the
        # workspace and every rar-rs feature combination, so a plain host check
        # would be a second compile of the same tree. This one is not redundant —
        # the binding's wasm build runs in the heavy matrix without denying
        # warnings, so wasm-only dead code (helpers gated to unix/windows) went
        # unnoticed. The toolchain install above already adds the target.
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p rar-rs --all-features --target wasm32-wasip1-threads --locked
      - name: Cargo check (fuzz workspace)
        # The fuzz crate must build both ways: without `fuzzing` the targets
        # fall back to their standalone `main` (the stable mode fuzz/README.md
        # documents), with it they are the libFuzzer binaries.
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - name: Cargo check (fuzz workspace, libFuzzer feature)
        # libfuzzer-sys compiles on stable (only `cargo fuzz` itself needs
        # nightly, for `-Z sanitizer`), so the `fuzzing` codepaths are
        # compiled on every run instead of only in the manual libFuzzer mode.
        # `--cfg fuzzing` is the switch cargo-fuzz sets; without it the
        # `fuzz_target!` entry points are never type-checked.
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --features fuzzing --locked
      - name: Clippy (workspace, all features and targets)
        # Also the workspace's `cargo check`: clippy drives the same build, so a
        # separate check step would only compile the tree twice.
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Clippy (rar-rs, the combinations the workspace cannot cover)
        # The library on its own, so each combination is seen in isolation. See
        # the script for why the workspace-wide check cannot cover this, and
        # why the all-features combination is already covered by it.
        run: bash scripts/ci/clippy-feature-matrix.sh
      - name: Dependency advisories, licenses and sources
        # `cargo clippy` checks this tree; this checks the crates it pulls in:
        # RustSec advisories, the license allow-list and the registry sources,
        # all against the lockfile. The configuration and the rationale for
        # each allowed license family live in the root `deny.toml`.
        #
        # `arguments` is prepended before the `check` subcommand by the
        # action, so only the global flags belong there; `--all-features`
        # matches the clippy step's feature set and `--locked` holds the
        # check to the committed lockfile.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --locked
      - name: Cargo doc (workspace)
        if: env.RUN_HEAVY == 'true'
        # `-D warnings` catches broken intra-doc links and malformed docs.
        # The tree is clean today (the old note about public docs linking to
        # private internals no longer applies), so treat any new warning as a
        # failure instead of silently publishing it.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      # The binding is built and typechecked once, in the `build` matrix (its
      # x86_64-unknown-linux-gnu entry). `check` used to build the native addon
      # for the `tsc` gate and then build the WASI addon, both of which the
      # matrix builds anyway — so a heavy run paid for two extra addon builds.
  # Behaviour, split from `check` so a red run names itself: compile, lint and
  # policy failures come from `check`, a failed test comes from here. Both jobs
  # compile the same tree into their own `target/` (`shared-key` differs), so
  # the split costs one extra restore and buys parallel wall clock and an
  # unambiguous failure kind.
  test:
    name: Tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official-tool cross-checks live in their own job (`test-interop`), so
    # this one no longer sets `SA_OFFICIAL_*`: the `official_interop` target
    # still compiles here but self-skips, and the fetch below stays for the
    # generated-corpus targets that read `.cache/winrar` off disk.
    steps:
      - uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        # No clippy/rustfmt components and no wasm target: this job only builds
        # the test profile. `-D warnings` is `check`'s business — a warning that
        # matters is already a failure there on the same tree.
        # Same `shared-key` as `check` (see the comment there): one dependency
        # cache for both Linux jobs.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - name: Cache WinRAR test builds
        uses: actions/cache@v6
        with:
          path: .cache/winrar
          key: winrar-tools-linux-${{ hashFiles('scripts/fetch_winrar.py') }}
      - name: Fetch WinRAR test builds
        # The legacy suites build their archives at run time instead of shipping
        # blobs. rarlab published Linux tarballs from 3.93 on, so 2.90 and 3.00 —
        # and every recipe that needs them — self-skip here; `test-windows` runs
        # the full set.
        run: python3 scripts/fetch_winrar.py
      - name: Verify WinRAR test builds
        # The suites self-skip on a missing tool, and this job has no
        # `SA_REQUIRE_WINRAR`, so a gap in the restored cache would quietly
        # reduce coverage instead of failing. `--check` reports the releases
        # this host has a build for (2.90/3.00 have no Linux tarball) and fails
        # on any other that is absent.
        run: python3 scripts/fetch_winrar.py --check
      - name: Cargo test (library + CLI suites)
        # Tests are a local gate by default (see docs/testing.md), but a stale
        # test assertion shipped with 0.12.0 because nothing ran them here. This
        # deterministic smoke — the library and CLI suites, the official-tool
        # interop, no JS/WASI binding suite (the earlier flake source) — closes
        # that gap without making a red run ambiguous.
        #
        # `parallel`/`simd` are the library's only features and no test is
        # `cfg(not(feature = ...))`, so `--all-features` executes everything the
        # split default/feature pair only compiled: before this ran once with
        # `default = []`, `extract_all_parallel`, `encode_chunked_mt` and the
        # simd paths were never *run*, which is how a dead progress tracker and a
        # `Collect` policy that silently behaved like `Abort` reached main. The
        # ungated build is still compiled, by the clippy matrix in `check`.
        #
        # The CLI targets are the two binaries' unit tests, `cli_behavior` (the
        # WinRAR switch contract, hermetic: temp dirs plus the
        # `CARGO_BIN_EXE_*` binaries this step builds) and `volume_bare_name`
        # (a Unix-only regression that no CI step ran). The official-tool
        # interop is no longer here — it is `test-interop` — so these suites are
        # the hermetic smoke that must stay fast and deterministic.
        run: |
          cargo test -p rar-rs --all-features --locked
          cargo test -p rar-cli --locked --bins --test cli_behavior --test volume_bare_name
          cargo test -p rar-rs-napi --lib --locked
      - name: Cargo test (generated legacy corpus, scalar features)
        # The generated-archive suites check the decoders against archives the
        # official Linux builds write, which is a different byte diet from the
        # Windows ones (host OS field, path separators, mtime/tz). No
        # `SA_REQUIRE_WINRAR` here: the releases this host has no build for must
        # keep skipping instead of failing the job. The target list lives in the
        # script, shared with `test-windows` and `scripts/ci-lint.sh`.
        #
        # Weekly and on tags only, because the step above already ran these
        # suites under `--all-features`: this step's added value is the same
        # assertions against a *scalar* library build (`default = []`), and it
        # pays for a second compile of the crate plus every test binary. The
        # feature matrix in `check` keeps the scalar build compiling on every
        # push; the behaviour it runs, once a week and before a tag, is enough.
        if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/ci/test-generated-corpus.sh
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Binding path-mapping tests (pure JS)
        # `wasi-path-map.test.mjs` imports only tracked sources
        # (`wasi-path-map.cjs`, `scripts/patch-wasi-loader.mjs`, `rar-rs.js`),
        # so it needs no addon build and cannot flake. It is the only gate on
        # the hand-written JS path mapping and on the loader's export table.
        run: node --test crates/rar-napi/__test__/wasi-path-map.test.mjs
      - name: Regression test the zig installer
        # Hermetic fixture server (no 47 MiB download); exercises the naming
        # variants, checksum failure, mirror race and the GITHUB_PATH export
        # that a previous release run got wrong. Unset GITHUB_PATH so the
        # fixture's fake zig is not appended to this job's real PATH.
        run: env -u GITHUB_PATH REPO="$GITHUB_WORKSPACE" bash scripts/ci/test-install-zig.sh
  # The official rar/unrar cross-checks, split out of `test`: on its own the
  # suite runs in parallel with the one it was buried in, and `SA_REQUIRE_OFFICIAL`
  # turns a missing tool into a failure instead of the skip marker a bare run
  # prints — a green `test` never proved the official tools read our archives,
  # which is what let the v0.16.1 tag fail on a Windows-only assumption. The
  # Windows half is `test-interop-windows`.
  test-interop:
    name: Interop (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SA_OFFICIAL_RAR: ${{ github.workspace }}/.cache/winrar/6-23/rar
      SA_OFFICIAL_UNRAR: ${{ github.workspace }}/.cache/winrar/7-23/unrar
      SA_OFFICIAL_SFX: ${{ github.workspace }}/.cache/winrar/6-23/default.sfx
      SA_REQUIRE_OFFICIAL: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        # Same `shared-key` as `check`/`test`; the interop compile reuses it.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - name: Cache WinRAR test builds
        uses: actions/cache@v6
        with:
          path: .cache/winrar
          key: winrar-tools-linux-${{ hashFiles('scripts/fetch_winrar.py') }}
      - name: Fetch WinRAR test builds
        run: python3 scripts/fetch_winrar.py
      - name: Verify WinRAR test builds
        # `SA_REQUIRE_OFFICIAL` above would fail on a missing binary; check the
        # cache right after the fetch so a gap names the release instead.
        run: python3 scripts/fetch_winrar.py --check
      - name: Cargo test (official rar/unrar interop)
        run: cargo test -p rar-rs --test official_interop --locked
  # The 32-bit word size, where the x86_64 suites are blind. Every
  # pointer-width bug this tree has had — rar29's VM block start, the rar5
  # dictionary caps and the encoder's dictionary shift, rar4's LONG_BLOCK
  # narrowing, the recovery grid — was `usize == u32` arithmetic reported by a
  # Debian i386 packager: on x86_64 the same code is correct, and a release
  # build wraps silently instead of panicking. `crates/rar` carries
  # `#[cfg(target_pointer_width = "32")]` regression tests (rar29.rs,
  # rar4_edit/layout.rs, the rar5 payload/quick_open caps, the decoder) that no
  # other job even compiles; this job is where they execute and fail.
  #
  # Linux/glibc i686 on purpose, not Windows x86: the fixes came from Debian's
  # i386 port, so `i686-unknown-linux-gnu` is the target a crate consumer on
  # Debian i386 actually gets. It mirrors `test`'s suite — `rar-rs
  # --all-features`, the rar-cli hermetic targets, the binding's lib tests —
  # one target triple apart; the default test profile keeps `overflow-checks`
  # on, which is what turns the wrap into the panic these tests assert.
  test-i686:
    name: Tests (linux, i686)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the 32-bit C runtime and linker
        # rustc links an i686 binary through `cc`, which needs the 32-bit crt
        # and libc under /usr/lib32; `gcc-multilib` is the one package cargo's
        # own contributor guide names, and it pulls `libc6-i386` (the 32-bit
        # loader the test binaries run under). Without it the link dies on
        # `gnu/stubs-32.h` and nothing executes.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - name: Install rust toolchain (stable + i686 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Cache cargo
        # Own key: a different target triple means a different artifact tree,
        # and sharing with `linux` would let the two evict each other.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-i686
      - name: Cargo test (rar-rs, all features, i686)
        # `test`'s first command, one target triple apart: the
        # `#[cfg(target_pointer_width = "32")]` regression tests and every
        # 32-bit-arithmetic path run here and nowhere else. No WinRAR fetch, so
        # the corpus suites self-skip — the 32-bit bugs live in hermetic unit
        # and integration tests, not in the generated archives.
        run: cargo test -p rar-rs --all-features --locked --target i686-unknown-linux-gnu
      - name: Cargo test (rar-cli hermetic suites, i686)
        # `test`'s second command: the CLI switch contract and the Unix-only
        # `volume_bare_name` regression, now at the 32-bit word size too.
        run: cargo test -p rar-cli --locked --bins --test cli_behavior --test volume_bare_name --target i686-unknown-linux-gnu
      - name: Cargo test (rar-rs-napi lib, i686)
        # `test`'s third command: the binding's public error contract at 32 bits.
        run: cargo test -p rar-rs-napi --lib --locked --target i686-unknown-linux-gnu
  # The floor declared in Cargo.toml (`rust-version`), compiled by that exact
  # toolchain. Without this job `rust-version` is a comment: `check`/`test` run
  # whatever `stable` is today, so a change that quietly requires a newer
  # compiler passes CI and only breaks consumers. The version is read from
  # Cargo.toml, not typed again here, so the job cannot drift from the manifest.
  msrv:
    name: MSRV (declared floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Read the declared MSRV
        id: msrv
        # `--no-deps` is the workspace manifests only. Every member inherits
        # `rust-version.workspace`, so the first value is the workspace's.
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | grep -o '"rust_version":"[^"]*"' | head -1 | cut -d'"' -f4 || true)"
          if [ -z "$version" ]; then
            echo "::error::no rust_version in cargo metadata; declare rust-version in Cargo.toml"
            exit 1
          fi
          echo "declared rust-version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the MSRV toolchain
        # `dtolnay/rust-toolchain` has no `profile` input — it installs with a
        # minimal profile by default — so passing one only logged a warning.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - name: Cargo check (workspace, all features)
        # `--all-features` matters: the crate's `parallel`/`simd` features pull
        # in deps (rayon, wide) that can raise the floor on their own, so a
        # default-features check would not prove the declared number.
        run: cargo check --workspace --all-features --locked
  # `check` and `test` run on Linux only. Everything under `#[cfg(windows)]` —
  # the WinRAR switch contract in cli_behavior, the separator hazards, the
  # windows-sys code paths — would otherwise be compiled for the first time by
  # the release matrix. Split into the same `check`/`test` pair Linux uses so a
  # red run names the failure kind. It used to be one job to save "runner
  # cost", but this repository is public and Actions minutes are free, so that
  # reason does not hold; the only price of the split is a second checkout,
  # toolchain install and cache restore (time, not money), and Windows runners
  # are slower and scarcer than Linux ones.
  check-windows:
    name: Checks (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    # The weekly run only re-evaluates RustSec advisories, which `check` does.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with `test-windows`: same toolchain and lock, so one
          # dependency cache serves both (as `linux` does for check/test).
          shared-key: windows
      - name: Clippy (workspace, all features and targets)
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
  # The `#[cfg(windows)]` code that only *running* executes: the CLI switch
  # contract, the unit tests, the binding's `error.rs`/`guard.rs` tests, and —
  # on tags/dispatches — the generated legacy corpus against the official
  # Windows builds (`SA_REQUIRE_WINRAR=1`), the only place the RAR 1.5-4.x
  # decode paths are exercised against real archives.
  test-windows:
    name: Tests (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    # The weekly run only re-evaluates RustSec advisories, which `check` does.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: Cache WinRAR test builds
        # Release-shaped: the generated corpus below is the only consumer left
        # here — the interop suites moved to `test-interop-windows`, which
        # fetches every push. The four official releases are minutes of
        # download, so only the release-shaped run pays for them.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v6
        with:
          path: .cache/winrar
          # `-v2`: the previous entry restored without some releases even though
          # the fetch below reported success, and the `SA_REQUIRE_WINRAR` run
          # then hit the gap. A fresh key forces one clean fetch.
          key: winrar-tools-v2-${{ hashFiles('scripts/fetch_winrar.py') }}
      - name: Fetch WinRAR test builds
        # The legacy corpus builds its archives with the official tool at run
        # time instead of shipping blobs, so it needs the releases on disk.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_winrar.py
      - name: Verify WinRAR test builds
        # `SA_REQUIRE_WINRAR` turns a missing tool into a panic deep inside the
        # corpus generator. Check the cache right after the fetch so a gap names
        # the release instead.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python scripts/fetch_winrar.py --check
      - name: Cargo test (library unit tests)
        # The `#[cfg(windows)]` unit tests: clippy compiles them, only a run
        # executes them, and they are the part a pull request actually needs.
        # Split out of the corpus step so that step can be release-only without
        # taking the unit tests with it.
        run: cargo test -p rar-rs --lib --locked
      - name: Cargo test (official-tool generated corpus)
        # Still release-shaped: it generates and decodes its whole legacy set,
        # which is worth a tag rather than every push (the interop suites moved
        # to `test-interop-windows`, which does run every push).
        # `SA_REQUIRE_WINRAR=1` turns a missing tool or a failed generation into
        # a test failure, so this run proves the RAR 1.5-4.x decode coverage
        # actually ran rather than silently skipping.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SA_REQUIRE_WINRAR: "1"
        run: bash scripts/ci/test-generated-corpus.sh
      - name: Cargo test (CLI switch contract + binding unit tests)
        # The binding's `error.rs`/`guard.rs` tests pin the public error
        # contract (code + status + marker prefix); clippy only compiles them.
        run: |
          cargo test -p rar-cli --locked --bins --test cli_behavior --test volume_bare_name
          cargo test -p rar-rs-napi --lib --locked
  # The Windows half of the official-tool cross-checks (see `test-interop`),
  # split out of `test-windows` so both compile and run in parallel: on its own
  # this job was the single longest step of `test-windows` (~3 of its ~6 min).
  # It fetches the releases every push; the corpus stays in `test-windows`,
  # release-shaped.
  test-interop-windows:
    name: Interop (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        # Same `shared-key` as `check-windows`/`test-windows`.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: Cache WinRAR test builds
        # Every push: the interop suites below need the releases on disk, and
        # the cache keeps an everyday run from re-downloading them.
        uses: actions/cache@v6
        with:
          path: .cache/winrar
          key: winrar-tools-v2-${{ hashFiles('scripts/fetch_winrar.py') }}
      - name: Fetch WinRAR test builds
        run: python scripts/fetch_winrar.py
      - name: Verify WinRAR test builds
        # `SA_REQUIRE_OFFICIAL`/`SA_REQUIRE_WINRAR` turn a missing tool into a
        # panic deep inside a suite. Check the cache right after the fetch so a
        # gap names the release instead.
        run: python scripts/fetch_winrar.py --check
      - name: Cargo test (official rar/unrar interop)
        # The same `SA_OFFICIAL_*` env the Linux `test-interop` sets, pointed at
        # the Windows builds (6-23 writes RAR4, 7-23 reads). `SA_REQUIRE_OFFICIAL=1`
        # turns a missing binary into a failure instead of a silent skip.
        env:
          SA_OFFICIAL_RAR: ${{ github.workspace }}/.cache/winrar/6-23/Rar.exe
          SA_OFFICIAL_UNRAR: ${{ github.workspace }}/.cache/winrar/7-23/UnRAR.exe
          SA_OFFICIAL_SFX: ${{ github.workspace }}/.cache/winrar/6-23/Default.SFX
          SA_REQUIRE_OFFICIAL: "1"
        run: cargo test -p rar-rs --test official_interop --locked
      - name: Cargo test (WinRAR interop, rar-cli)
        # `rar-cli`'s Windows-native suite drives a real `WinRAR.exe`/`UnRAR.exe`
        # for the switch contract. `SA_WINRAR_DIR` is the fetched 7-23 dir;
        # `rar4_623_bin()` still pulls 6-23 from the cache for the RAR4 writer.
        env:
          SA_WINRAR_DIR: ${{ github.workspace }}/.cache/winrar/7-23
          SA_REQUIRE_WINRAR: "1"
        run: cargo test -p rar-cli --test winrar_interop --locked
  # Chooses the `build` matrix per event. The list itself lives in
  # scripts/ci/build-matrix.js — one entry per shipped addon, one of them marked
  # `smoke` — so a pull request rehearses the release pipeline on a single
  # cheap target (native, no zig) and a tag builds all nine, from one source
  # that cannot drift.
  build-matrix:
    name: select the build matrix
    # Push to main only retests a tree that a pull request already built.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      settings: ${{ steps.select.outputs.settings }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        # `console.log` of a stringified array cannot emit a newline, which is
        # what makes a one-line `$GITHUB_OUTPUT` entry safe to `fromJSON` on the
        # other side. The checks are cheap and they turn a silently empty or
        # duplicated matrix into a named error instead of a phantom build.
        run: |
          node -e '
            const all = require("./scripts/ci/build-matrix.js");
            const picked =
              process.env.EVENT_NAME === "pull_request" ? all.filter((s) => s.smoke) : all;
            if (picked.length === 0) throw new Error("no matrix entry selected");
            const seen = new Set();
            for (const entry of picked) {
              for (const key of ["host", "target", "addon", "build"]) {
                if (!entry[key]) throw new Error("matrix entry is missing " + key);
              }
              if (seen.has(entry.target)) throw new Error("duplicate target " + entry.target);
              seen.add(entry.target);
            }
            console.error("selected: " + picked.map((s) => s.target).join(", "));
            console.log("settings=" + JSON.stringify(picked));
          ' >> "$GITHUB_OUTPUT"
  build:
    name: build - ${{ matrix.settings.target }} - node@24
    needs: build-matrix
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.build-matrix.outputs.settings) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A `release_tag` dispatch builds that tag; everything else builds the
          # triggering ref (tag push, branch, PR).
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain (stable + cross target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        continue-on-error: true # transient service outages must not fail builds
        with:
          path: |
            ~/.cargo/git/db/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-${{ matrix.settings.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache zig and cargo-zigbuild
        if: contains(matrix.settings.target, 'musl')
        # The ziglang.org download is the slow part of the two musl jobs, so the
        # unpacked toolchain is cached and the download happens once per version.
        # `cargo install cargo-zigbuild` compiles from source, so its binary is
        # cached too.
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/zig
            /usr/local/cargo/bin/cargo-zigbuild
            ~/.cargo/bin/cargo-zigbuild
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: Install the musl cross toolchain (zig + cargo-zigbuild)
        if: contains(matrix.settings.target, 'musl')
        # One step for both halves because they are only ever needed together:
        # `napi build -x` is cargo-zigbuild, which drives `zig`. The script
        # installs whichever half its version variable names, which is what lets
        # `scripts/ci/test-install-zig.sh` exercise the zig half alone. Twenty
        # minutes covers a cold `cargo install cargo-zigbuild` (compiled from
        # source) and a 45 MB tarball behind a warm cache key; the job's own
        # 45-minute budget is the only limit that used to apply, so a hung
        # download could eat the whole build.
        timeout-minutes: 20
        env:
          ZIG_HOME: ${{ runner.temp }}/zig
        run: bash scripts/ci/install-musl-toolchain.sh
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build
        working-directory: crates/rar-napi
        run: ${{ matrix.settings.build }}
      - name: Build the rar/unrar CLI
        if: matrix.settings.cli != ''
        # The two executables crates/rar-cli publishes, built for the same
        # target as the addon above: `cargo zigbuild` for the static musl rows
        # (zig and cargo-zigbuild are on PATH from the step above), plain
        # `cargo build` otherwise. The target itself is already installed.
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.settings.target }}'
          if [[ "$target" == *musl* ]]; then
            cargo zigbuild --release -p rar-cli --target "$target"
          else
            cargo build --release -p rar-cli --target "$target"
          fi
      - name: Package the rar/unrar CLI
        if: matrix.settings.cli != ''
        # A tarball, not two loose assets, so `rar` and `unrar` from the same
        # build stay together and the payload has one entry per platform. The
        # bytes are repacked on every run (tar records mtimes), so a consumer
        # that wants a stable digest hashes the executables inside.
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.settings.target }}'
          ext=''
          case "$target" in *windows*) ext='.exe';; esac
          src="target/$target/release"
          staging=$(mktemp -d)
          cp "$src/rar$ext" "$src/unrar$ext" "$staging/"
          tar -czf "crates/rar-napi/${{ matrix.settings.cli }}" -C "$staging" "rar$ext" "unrar$ext"
      - name: Typecheck the binding's public types
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        working-directory: crates/rar-napi
        # The binding's type gate, run once on the entry whose `binding.d.ts`
        # was just generated. `rar-rs.d.ts` is hand-written and
        # `__test__/types.test-d.ts` asserts the surface a consumer sees, so a
        # typing regression fails here. The generated loader and types are
        # byte-identical on every target (the release job proves it), so one
        # target is enough.
        run: npm run typecheck
      - name: Verify native addon artifact
        working-directory: crates/rar-napi
        run: |
          set -euo pipefail
          shopt -s nullglob
          node_files=( *.node )
          if (( ${#node_files[@]} != 1 )); then
            echo "::error::expected exactly one .node file, found ${#node_files[@]}"
            printf 'found: %s\n' "${node_files[@]:-<none>}"
            exit 1
          fi
          if [[ "${node_files[0]}" != "${{ matrix.settings.addon }}" ]]; then
            echo "::error::expected ${{ matrix.settings.addon }}, found ${node_files[0]}"
            exit 1
          fi
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            crates/rar-napi/${{ matrix.settings.addon }}
            crates/rar-napi/binding.js
            crates/rar-napi/binding.d.ts
          if-no-files-found: error
          # `release` downloads these in the same run, minutes later; the 90-day
          # default stores 9 addons for three months in the org's quota for no
          # reason. A re-release rebuilds them anyway (the matrix runs again).
          retention-days: 7
      - name: Upload the CLI artifact
        if: matrix.settings.cli != ''
        # A separate artifact, so `release` can pull the CLI archives without
        # them landing in the npm payload (`publish-npm` downloads only
        # `bindings-*`).
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.settings.target }}
          path: crates/rar-napi/${{ matrix.settings.cli }}
          if-no-files-found: error
          retention-days: 7
  build-wasm:
    name: build - wasm32-wasip1-threads
    # Every event except push to main: the WASI bundle is what the `types` and
    # `__test__` suites exercise, so a pull request builds it too (~4 minutes,
    # in parallel) rather than learning about a broken wasi pipeline from a tag.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Same ref rule as the native matrix: a `release_tag` dispatch builds
          # that tag's WASI bundle.
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build WASM
        working-directory: crates/rar-napi
        # `npm run build:wasi` is the single source of truth for the flags (and
        # runs `scripts/patch-wasi-loader.mjs`, which must stay the last step).
        # It uses `--no-js --dts rar-rs-napi.wasi.d.cts`: the WASI build must
        # not touch `binding.js`/`binding.d.ts`, the native build's platform
        # resolver and types (`binding.js` already carries the WASI fallback
        # chain). @napi-rs/cli always names the flavor loader
        # `<binaryName>.wasi.cjs`, so `--js` could only add a second, unused
        # resolver under the wasm output name.
        run: npm run build:wasi
        shell: bash
      - name: Patch WASI loader for Windows host paths
        working-directory: crates/rar-napi
        # Idempotent, and `build:wasi` already ran it: this step exists so the
        # log shows the patch landed, not to do it a second time for real.
        run: node scripts/patch-wasi-loader.mjs
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wasm32-wasip1-threads
          path: |
            crates/rar-napi/rar-rs-napi.wasm32-wasi.wasm
            crates/rar-napi/rar-rs-napi.wasm32-wasi.debug.wasm
            crates/rar-napi/rar-rs-napi.wasi.cjs
            crates/rar-napi/rar-rs-napi.wasi.d.cts
            crates/rar-napi/rar-rs-napi.wasi-browser.js
            crates/rar-napi/wasi-path-map.cjs
            crates/rar-napi/wasi-worker.mjs
            crates/rar-napi/wasi-worker-browser.mjs
          if-no-files-found: error
          retention-days: 7
  release:
    name: Release (${{ github.event.inputs.release_tag || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A tag push releases itself; a dispatch releases the tag it names. Both
    # paths wait for the whole matrix, so a release only ever assembles
    # artifacts that this run produced. (`check`/`test` validate the dispatch
    # ref, not the tag; for a re-release that is the point — a tag that passed
    # CI once must not be blocked by a rule that tightened later. The tag's own
    # gates are the version check below and the artifact identity checks.)
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs:
      - check
      - test
      - test-interop
      - test-i686
      - msrv
      - check-windows
      - test-windows
      - test-interop-windows
      - build
      - build-wasm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          # The notes below are generated from the commits between this tag and
          # the previous one, so the shallow default is not enough.
          fetch-depth: 0
      - name: Resolve the release tag
        id: tag
        # `github.ref_name` is the tag on a tag push and `main` on a dispatch, so
        # every later step reads the tag from this one place. A dispatch names
        # the tag by hand, and a typo or a deleted tag must fail here instead of
        # publishing under a branch name.
        env:
          REQUESTED: ${{ github.event.inputs.release_tag }}
          PUSHED: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-$PUSHED}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::release tag must look like v1.2.3, got '$TAG'"; exit 1 ;;
          esac
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null ||
            { echo "::error::tag $TAG does not exist in this repository"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches the workspace version
        # Same five-field check as `check`, plus the tag: the checkout is the tag
        # itself, so this is the proof that the tag and every manifest agree. One
        # script, so the two jobs cannot parse the versions differently.
        run: bash scripts/ci/check-versions.sh "${{ steps.tag.outputs.tag }}"
        shell: bash
      - name: Download the native bindings
        # One directory per artifact, as the release's identity checks expect
        # (`binding.js` must be byte-identical across all nine). `pattern` is a
        # single glob: download-artifact has no multi-line/negation form, so the
        # WASI artifact (`bindings-wasm32-wasip1-threads`) comes along and is
        # fetched again below — it carries no `.node` and no `binding.js`, so
        # every check here ignores it.
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: bindings
      - name: Download WASI bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: wasm
      - name: Download the CLI binaries
        # Into `bindings` beside the addons, so the single `--cli` collect pass
        # sees both families. `publish-npm` deliberately does not download these,
        # so the CLI archives never reach the npm payload.
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: bindings
      - name: Collect release assets
        # A script, because its rules are what make a release complete: one
        # addon per platform, every WASI file, byte-identical generated loaders,
        # no collision when the license tree is flattened, and (with `--cli`)
        # one rar/unrar archive per CLI row. Inline, the first execution of that
        # logic was a tag; as a script it is fixture-tested on every push by
        # scripts/ci/test-release-scripts.sh.
        run: bash scripts/ci/collect-release-assets.sh --cli
        shell: bash
      - name: Generate release notes from commits
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        # Also a script: the grouping, the re-release range (`--merged`) and the
        # first-release fallback are asserted by the same fixture test.
        run: bash scripts/ci/release-notes.sh "$TAG" "$RUNNER_TEMP/release-notes.md"
        shell: bash
      - name: Publish the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        # Idempotent: re-running a tag that already has a release replaces the
        # notes and overwrites the assets (`--clobber`), so a run that died
        # mid-upload converges instead of leaving a half-populated release.
        # The VS Code consumer pins these digests, so a re-run that changes a
        # byte means re-pinning on that side: `docs/ci.md` says which assets are
        # reproducible and which are rebuilt by the MSVC linker.
        # `--verify-tag` keeps a release from being created off a typo'd ref.
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=( release/* )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi

  # Last, and only for a tag (or a dispatch that re-releases one): the version
  # already exists on the GitHub Release by the time this runs, so a matrix
  # failure never becomes a permanent crates.io version (those can only be
  # yanked, never replaced). `scripts/ci/publish-crates.sh` does the ordering
  # (`rar-rs` first, index polled between crates) and the idempotency
  # (versions already on the index are skipped), which is what makes a
  # `release_tag` dispatch a gap-filler rather than a failure.
  publish:
    name: Publish to crates.io (${{ github.event.inputs.release_tag || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs:
      - release
    # The only job that writes outside the repository: `id-token: write` lets
    # the OIDC exchange below mint a short-lived crates.io token, so no
    # long-lived secret is stored in the repository. crates.io trusts this
    # workflow only if a Trusted Publisher entry names this file (`CI.yml`) and
    # this repository — one entry per crate (`rar-rs`, `rar-cli`,
    # `rar-rs-napi`).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          # The overlay below needs the workflow's own commit in the object
          # database; a shallow clone of the tag would not have it.
          fetch-depth: 0
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Take the release scripts from the workflow's own commit
        # Publishing reads the working tree, so the tag's tree is what ships —
        # but a `release_tag` dispatch repairs a tag that may predate these
        # scripts (v0.15.2 does), and the repaired run should use the fixed
        # tooling rather than the tooling that was broken when the tag was cut.
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$REF"
          git checkout "$SHA" -- scripts/ci
        shell: bash
      - name: Verify the tag matches the workspace version
        # Same five-field check as `check` and `release`: publishing is the one
        # step that cannot be undone, so it re-runs the guard from the tag's own
        # checkout rather than trusting the earlier job's.
        run: bash scripts/ci/check-versions.sh "${{ github.event.inputs.release_tag || github.ref_name }}"
        shell: bash
      - name: Mint a crates.io token for this workflow
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the three crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/ci/publish-crates.sh
        shell: bash
  publish-npm:
    name: Publish to npm (${{ github.event.inputs.release_tag || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs:
      - release
    # The second job that writes outside the repository, and the second to use
    # OIDC: `id-token: write` lets npm exchange a short-lived publishing token
    # (and signs the provenance attestation), so no secret is stored. That works
    # only once a Trusted Publisher entry names this workflow for the package —
    # npm cannot authorize the *first* publish of a name that way, which is why
    # the first one was done by hand with a token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          # Same reason as `publish`: the overlay needs the workflow's commit.
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Take the release scripts from the workflow's own commit
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$REF"
          git checkout "$SHA" -- scripts/ci
        shell: bash
      - name: Verify the tag matches the workspace version
        # The npm version is the crate version, so this is the same guard the
        # crates.io job runs: publishing is what cannot be undone.
        run: bash scripts/ci/check-versions.sh "${{ github.event.inputs.release_tag || github.ref_name }}"
        shell: bash
      - name: Download the native bindings
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: bindings
      - name: Download WASI bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: wasm
      - name: Assemble the release payload
        # The same script and the same rules as `release`: the tarballs npm
        # serves and the assets the Release carries are one set of bytes.
        run: bash scripts/ci/collect-release-assets.sh bindings wasm release .
        shell: bash
      - name: Publish the package that carries every platform binary
        # No `NODE_AUTH_TOKEN`: with `id-token: write` npm exchanges the workflow
        # identity for a publishing token, the same way `publish` does with
        # crates.io. `--provenance` signs the tarball with that identity.
        env:
          NPM_PUBLISH_FLAGS: --access public --provenance
        run: bash scripts/ci/publish-npm.sh release
        shell: bash
