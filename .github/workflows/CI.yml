name: CI
env:
  DEBUG: napi:*
  APP_NAME: rar-rs-napi
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
      - '**/*.gitignore'
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The rar-rs workspace ships a pure-Rust library (crates/rar), CLI
# (crates/rar-cli) and the rar-rs-napi binding
# (crates/rar-napi, native .node + wasm32-wasip1-threads). No npm package
# is published: the VS Code consumer downloads the compiled artifacts from
# the GitHub Release assets (tag v*), SHA-256 pinned in its installer —
# every release ships a SHA-256SUMS manifest for that.
# The binding's JS tests run with `node --test` under crates/rar-napi.
#
# This file must live at the repository ROOT: GitHub Actions only executes
# .github/workflows/*.yml from the default branch root; the old copy under
# crates/rar-napi/.github/workflows/ was never run.
jobs:
  lint:
    name: Lint + workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads
      - name: Cargo fmt (workspace)
        run: cargo fmt --all --check
      - name: Cargo check (workspace defaults)
        run: cargo check --workspace --all-targets --locked
      - name: Cargo check (rar-rs, no default features)
        run: cargo check -p rar-rs --no-default-features --locked
      - name: Cargo check (fuzz workspace)
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - name: Clippy (workspace, all features and targets)
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Cargo test (workspace)
        run: cargo test --workspace --all-features --locked
      - name: Install binding dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build addon (native)
        working-directory: crates/rar-napi
        run: npx napi build --platform --release
      - name: Test addon (native)
        working-directory: crates/rar-napi
        run: npm test
      - name: Build WASM addon
        working-directory: crates/rar-napi
        run: npx napi build --platform --release --target wasm32-wasip1-threads
      - name: Patch WASI loader for Windows host paths
        working-directory: crates/rar-napi
        run: node scripts/patch-wasi-loader.mjs
      - name: Test addon (WASI forced)
        working-directory: crates/rar-napi
        run: NAPI_RS_FORCE_WASI=error npm test
  build:
    name: build - ${{ matrix.settings.target }} - node@24
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            addon: rar-rs-napi.darwin-arm64.node
            build: npx napi build --platform --release --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            addon: rar-rs-napi.win32-x64-msvc.node
            build: npx napi build --platform --release --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: i686-pc-windows-msvc
            addon: rar-rs-napi.win32-ia32-msvc.node
            build: npx napi build --platform --release --target i686-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            addon: rar-rs-napi.win32-arm64-msvc.node
            build: npx napi build --platform --release --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            addon: rar-rs-napi.linux-x64-gnu.node
            build: npx napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            addon: rar-rs-napi.linux-x64-musl.node
            build: npx napi build --platform --release --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            addon: rar-rs-napi.linux-arm64-gnu.node
            build: npx napi build --platform --release --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            addon: rar-rs-napi.linux-arm64-musl.node
            build: npx napi build --platform --release --target aarch64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            addon: rar-rs-napi.linux-arm-gnueabihf.node
            build: npx napi build --platform --release --target armv7-unknown-linux-gnueabihf --use-napi-cross
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain (stable + cross target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        continue-on-error: true # transient service outages must not fail builds
        with:
          path: |
            ~/.cargo/git/db/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-${{ matrix.settings.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install zig (musl cross builds)
        if: contains(matrix.settings.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install cargo-zigbuild
        if: contains(matrix.settings.target, 'musl')
        run: |
          cargo install cargo-zigbuild --version 0.23.4 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build
        working-directory: crates/rar-napi
        run: ${{ matrix.settings.build }}
      - name: Verify native addon artifact
        working-directory: crates/rar-napi
        run: |
          set -euo pipefail
          shopt -s nullglob
          node_files=( *.node )
          if (( ${#node_files[@]} != 1 )); then
            echo "::error::expected exactly one .node file, found ${#node_files[@]}"
            printf 'found: %s\n' "${node_files[@]:-<none>}"
            exit 1
          fi
          if [[ "${node_files[0]}" != "${{ matrix.settings.addon }}" ]]; then
            echo "::error::expected ${{ matrix.settings.addon }}, found ${node_files[0]}"
            exit 1
          fi
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            crates/rar-napi/${{ matrix.settings.addon }}
            crates/rar-napi/index.js
            crates/rar-napi/index.d.ts
          if-no-files-found: error
  build-wasm:
    name: build - wasm32-wasip1-threads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build WASM
        working-directory: crates/rar-napi
        run: npx napi build --platform --release --target wasm32-wasip1-threads
        shell: bash
      - name: Patch WASI loader for Windows host paths
        working-directory: crates/rar-napi
        run: node scripts/patch-wasi-loader.mjs
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wasm32-wasip1-threads
          path: |
            crates/rar-napi/rar-rs-napi.wasm32-wasi.wasm
            crates/rar-napi/rar-rs-napi.wasm32-wasi.debug.wasm
            crates/rar-napi/rar-rs-napi.wasi.cjs
            crates/rar-napi/rar-rs-napi.wasi.d.cts
            crates/rar-napi/rar-rs-napi.wasi-browser.js
            crates/rar-napi/wasi-path-map.cjs
            crates/rar-napi/wasi-worker.mjs
            crates/rar-napi/wasi-worker-browser.mjs
            crates/rar-napi/index.js
            crates/rar-napi/index.d.ts
          if-no-files-found: error
  test-bindings:
    name: Test bindings on ${{ matrix.settings.host }} (${{ matrix.settings.target }})
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            triple: win32-x64-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            triple: win32-arm64-msvc
            architecture: arm64
          - host: macos-latest
            target: aarch64-apple-darwin
            triple: darwin-arm64
            architecture: arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
            architecture: x64
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            triple: linux-arm64-gnu
            architecture: arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.settings.architecture }}
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/rar-napi
      - name: Verify addon filename matches loader expectation
        working-directory: crates/rar-napi
        run: |
          node -e "
          const fs = require('fs');
          const f = fs.readdirSync('.').find((n) => n.endsWith('.node'));
          if (!f) { console.error('no .node artifact'); process.exit(1); }
          const expect = 'rar-rs-napi.${{ matrix.settings.triple }}.node';
          if (f !== expect) { console.error('expected', expect, 'got', f); process.exit(1); }
          console.log('ok:', f);
          "
        shell: bash
      - name: Test addon
        working-directory: crates/rar-napi
        run: npm test
        shell: bash
  test-wasm:
    name: Test WASI binding on ${{ matrix.os }}
    needs:
      - build-wasm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Download WASI artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: crates/rar-napi
      - name: Test addon (WASI forced)
        working-directory: crates/rar-napi
        run: NAPI_RS_FORCE_WASI=error npm test
        shell: bash
  release:
    name: Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - build
      - test-bindings
      - build-wasm
      - test-wasm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify tag matches Cargo.toml and package.json versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(
            awk '
              $0 == "[package]" { in_package = 1; next }
              in_package && /^\[/ { in_package = 0 }
              in_package && /^version[[:space:]]*=/ {
                gsub(/^[^=]*=[[:space:]]*"/, "")
                gsub(/"[[:space:]]*$/, "")
                print
                exit
              }
            ' crates/rar-napi/Cargo.toml
          )"
          PACKAGE_VERSION="$(node -p "require('./crates/rar-napi/package.json').version")"
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::could not read crates/rar-napi/Cargo.toml package version"
            exit 1
          fi
          if [ "$TAG" != "$CARGO_VERSION" ] || [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag v$TAG, Cargo.toml $CARGO_VERSION, and package.json $PACKAGE_VERSION must match"
            exit 1
          fi
          echo "releasing v$TAG"
        shell: bash
      - name: Download all bindings
        uses: actions/download-artifact@v8
        with:
          path: bindings
      - name: Download WASI bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: wasm
      - name: Collect release assets
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p release

          EXPECTED_ADDONS=(
            rar-rs-napi.darwin-arm64.node
            rar-rs-napi.win32-x64-msvc.node
            rar-rs-napi.win32-ia32-msvc.node
            rar-rs-napi.win32-arm64-msvc.node
            rar-rs-napi.linux-x64-gnu.node
            rar-rs-napi.linux-x64-musl.node
            rar-rs-napi.linux-arm64-gnu.node
            rar-rs-napi.linux-arm64-musl.node
            rar-rs-napi.linux-arm-gnueabihf.node
          )
          mapfile -d '' -t NODE_FILES < <(find bindings -type f -name '*.node' -print0 | sort -z)
          if (( ${#NODE_FILES[@]} != ${#EXPECTED_ADDONS[@]} )); then
            echo "::error::expected ${#EXPECTED_ADDONS[@]} native addons, found ${#NODE_FILES[@]}"
            printf 'found: %s\n' "${NODE_FILES[@]:-<none>}"
            exit 1
          fi
          for addon in "${EXPECTED_ADDONS[@]}"; do
            mapfile -d '' -t matches < <(find bindings -type f -name "$addon" -print0 | sort -z)
            if (( ${#matches[@]} != 1 )); then
              echo "::error::expected exactly one $addon artifact, found ${#matches[@]}"
              exit 1
            fi
            cp "${matches[0]}" release/
          done

          # Every listed WASI file is part of the release contract. A missing
          # file must fail this step rather than produce a partial release.
          cp wasm/rar-rs-napi.wasm32-wasi.wasm \
             wasm/rar-rs-napi.wasm32-wasi.debug.wasm \
             wasm/rar-rs-napi.wasi.cjs \
             wasm/rar-rs-napi.wasi.d.cts \
             wasm/rar-rs-napi.wasi-browser.js \
             wasm/wasi-path-map.cjs \
             wasm/wasi-worker.mjs \
             wasm/wasi-worker-browser.mjs release/

          copy_identical_generated_file() {
            local name="$1"
            local source
            mapfile -d '' -t files < <(find bindings -type f -name "$name" -print0 | sort -z)
            if (( ${#files[@]} == 0 )); then
              echo "::error::no $name artifact was downloaded"
              exit 1
            fi
            source="${files[0]}"
            for candidate in "${files[@]:1}"; do
              if ! cmp -s "$source" "$candidate"; then
                echo "::error::$name differs between $source and $candidate"
                exit 1
              fi
            done
            cp "$source" "release/$name"
          }
          copy_identical_generated_file index.js
          copy_identical_generated_file index.d.ts

          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md release/

          mapfile -d '' -t LICENSE_FILES < <(find LICENSES -type f -print0 | sort -z)
          if (( ${#LICENSE_FILES[@]} == 0 )); then
            echo "::error::no identified license-family texts found under LICENSES/"
            exit 1
          fi
          for file in "${LICENSE_FILES[@]}"; do
            relative="${file#LICENSES/}"
            flattened="${relative//\//__}"
            destination="release/THIRD_PARTY_LICENSE-$flattened"
            if [[ -e "$destination" ]]; then
              echo "::error::flattened license filename collision: $destination"
              exit 1
            fi
            cp "$file" "$destination"
          done

          # Write outside release/ so SHA-256SUMS can never hash itself.
          (cd release && sha256sum *) > SHA-256SUMS.tmp
          mv SHA-256SUMS.tmp release/SHA-256SUMS
          ls -la release/
        shell: bash
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/* 2>&1 || \
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
