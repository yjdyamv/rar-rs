name: CI
env:
  DEBUG: napi:*
  APP_NAME: rar-rs-napi
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  # Full (release-grade) work — binding matrix builds/tests, fuzz smoke runs,
  # rustdoc — runs on tags, the weekly schedule and manual dispatches. The
  # per-push/PR run keeps only what catches a broken change fast: fmt, the
  # host-path guard, cargo check/clippy, the workspace tests and the Windows
  # CLI suite. A red push is then readable in ~6-8 minutes instead of 8-25.
  RUN_HEAVY: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') }}
'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
      - '**/*.gitignore'
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly official-tool interop sweep (see the `interop` job). Scheduled
    # workflows only run on the default branch.
    - cron: '17 4 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The rar-rs workspace ships a pure-Rust library (crates/rar), CLI
# (crates/rar-cli) and the rar-rs-napi binding
# (crates/rar-napi, native .node + wasm32-wasip1-threads). No npm package
# is published: the VS Code consumer downloads the compiled artifacts from
# the GitHub Release assets (tag v*), SHA-256 pinned in its installer —
# every release ships a SHA-256SUMS manifest for that.
# The binding's JS tests run with `node --test` under crates/rar-napi.
#
# Trigger split (see `RUN_HEAVY`): pushes/PRs run `lint` + `windows-cli`
# only; tags, the weekly schedule and manual dispatches additionally run the
# binding build/test matrices, the fuzz smoke loop and rustdoc.
#
# This file must live at the repository ROOT: GitHub Actions only executes
# .github/workflows/*.yml from the default branch root; the old copy under
# crates/rar-napi/.github/workflows/ was never run.
jobs:
  lint:
    name: Lint + workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        if: env.RUN_HEAVY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads
      - name: Cargo fmt (workspace)
        run: cargo fmt --all --check
      - name: Host-path separator guard
        # Host paths (disk, destination directory, volumes, -w/-op/--dest)
        # must test separators through `std::path::is_separator`, which is
        # platform-correct: `/` everywhere, `\` only on Windows. A literal
        # `ends_with('\\')` is a Windows-only assumption that made
        # `rar x p.rar dest\` create a literal `dest\` directory on Linux.
        # Archive-member names may still normalize `\` -> `/` (RAR stores
        # backslashes), so only the method-on-char-literal shape is guarded.
        run: |
          set -euo pipefail
          printf "ends_with('%s')\nstarts_with('%s')\n" '\\' '\\' > /tmp/host-sep-patterns
          if grep -rnFf /tmp/host-sep-patterns --include='*.rs' crates/rar-cli/src crates/rar/src; then
            echo "::error::host paths must use std::path::is_separator, not a literal backslash check"
            exit 1
          fi
      - name: Cargo check (workspace defaults)
        run: cargo check --workspace --all-targets --locked
      - name: Cargo check (rar-rs, no default features)
        run: cargo check -p rar-rs --no-default-features --locked
      - name: Cargo check (fuzz workspace)
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - name: Cargo fmt (fuzz workspace)
        # `fuzz/` is not a workspace member, so `cargo fmt --all` never
        # covers its targets.
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Cargo check (fuzz workspace, libFuzzer feature)
        # libfuzzer-sys compiles on stable (only `cargo fuzz` itself needs
        # nightly, for `-Z sanitizer`), so the `fuzzing` codepaths are
        # compiled on every run instead of only in the manual libFuzzer mode.
        # `--cfg fuzzing` is the switch cargo-fuzz sets; without it the
        # targets fall back to their standalone `main` and the
        # `fuzz_target!` entry points are never type-checked.
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --features fuzzing --locked
      - name: Fuzz smoke (standalone mutation loop)
        if: env.RUN_HEAVY == 'true'
        # Bounded run so the targets are exercised, not just compiled: the
        # read-side targets are cheap, the write-side ones do real file I/O.
        env:
          # The smoke run exists to catch panics; a plain `--release` would
          # compile the arithmetic/assert checks out, so force them back on
          # for this step only.
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'true'
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'true'
          # A fixed seed would replay the same mutation sequence every run.
          # `github.run_id` varies per run but stays deterministic, so a
          # failure can be reproduced with the seed printed by the target.
          FUZZ_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for t in parse crypto recovery rev legacy; do
            FUZZ_ITERATIONS=5000 cargo run --release --locked --manifest-path fuzz/Cargo.toml --bin "$t"
          done
          for t in write rewrite; do
            FUZZ_ITERATIONS=500 cargo run --release --locked --manifest-path fuzz/Cargo.toml --bin "$t"
          done
      - name: Clippy (workspace, all features and targets)
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Clippy (rar-rs, every feature combination)
        # The workspace build unifies features across crates (rar-rs-napi
        # pulls in parallel + simd), which hides targets that use a gated API
        # without declaring `required-features` for it — the mtwin example
        # failed `cargo check -p rar-rs --all-targets` for that reason while
        # the workspace check stayed green. Check the library on its own so
        # each combination is seen in isolation.
        run: |
          set -euo pipefail
          for f in "" parallel simd parallel,simd; do
            echo "::group::features='$f'"
            cargo clippy -p rar-rs --no-default-features --features "$f" --all-targets --locked -- -D warnings
            echo "::endgroup::"
          done
        shell: bash
      - name: Cargo test (workspace)
        # `--no-fail-fast`: a platform-specific failure in an early target
        # must not hide failures in later targets, so one red run reports the
        # whole list instead of revealing them one per push.
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Official interop skip visibility
        # The workspace test above runs this target with its output captured,
        # hiding the gating helpers' SKIPPED markers. Replay just the cheap
        # official_interop target with --nocapture so a green lint run cannot
        # be read as official-tool coverage (the scheduled `interop` job runs
        # it for real with SA_REQUIRE_OFFICIAL=1).
        run: cargo test --workspace --all-features --locked --test official_interop -- --nocapture
      - name: Cargo doc (workspace)
        if: env.RUN_HEAVY == 'true'
        # Build-only: several pre-existing public docs link to private
        # internals, so `-D warnings` is not on yet.
        run: cargo doc --workspace --no-deps --locked
      - name: Install binding dependencies
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build addon (native)
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: npx napi build --platform --release
      - name: Test addon (native)
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: npm test
      - name: Build WASM addon
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: npx napi build --platform --release --target wasm32-wasip1-threads
      - name: Patch WASI loader for Windows host paths
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: node scripts/patch-wasi-loader.mjs
      - name: Test addon (WASI forced)
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: NAPI_RS_FORCE_WASI=error npm test
  windows-cli:
    name: CLI tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v6
        continue-on-error: true # transient service outages must not fail builds
        with:
          path: |
            ~/.cargo/git/db/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-cli-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cargo test (rar-cli)
        # The CLI's Windows-only paths (ReplaceFileW, registry SFX lookup)
        # are never exercised by the ubuntu lint job.
        run: cargo test -p rar-cli --locked
      - name: Cargo test (rar-rs, Windows-only paths)
        # quick_open_streams.rs, the Windows half of write_symlink_cycle.rs
        # and rar5_erase_volume_errors.rs are #[cfg(windows)] and are
        # compiled out of the ubuntu lint job.
        run: cargo test -p rar-rs --locked
      - name: WinRAR interop skip visibility
        # Hosted runners have no WinRAR, so the suite self-skips. Run it with
        # --nocapture so the log shows the SKIPPED markers instead of reading
        # as if the interop ran; when WinRAR is present it runs for real.
        run: cargo test -p rar-cli --locked --test winrar_interop -- --nocapture
  interop:
    name: Official rar/unrar interop (scheduled)
    # Scheduled/manual only: the push/PR jobs must not depend on the rarlab
    # network fetch, so the official-binary suites would always self-skip
    # there. This job fetches the freeware console tools and runs them with
    # SA_REQUIRE_OFFICIAL=1, turning "silently skipped" into a hard error.
    # WinRAR itself is not freely installable on hosted runners, so the
    # winrar_interop suite runs in the windows-cli job when present and
    # prints visible SKIPPED markers otherwise.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The rarlab download is best-effort: a fetch failure is tolerated by
    # the fetch step's own `continue-on-error` and the test step is gated on
    # the fetch outcome (a skip warning, not a failure). Once the tools are
    # present, however, an interop regression fails this job: no job-level
    # `continue-on-error` masks the test step.
    steps:
      - uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v6
        continue-on-error: true # transient service outages must not fail builds
        with:
          path: |
            ~/.cargo/git/db/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-interop-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Fetch official RAR console tools
        id: fetch
        # Kept tolerant so a rarlab outage ends in a green job with an
        # explicit skip notice, not a red scheduled run.
        continue-on-error: true
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rarlab"
          mkdir -p "$root"
          # Two releases are needed: 7.23's UnRAR validates every archive we
          # emit, while the RAR writer must be 6.23 — the official_interop
          # suite drives `rar a -ma4` against 6.23-created RAR4 archives and
          # 7.23 removed RAR4 creation (it rejects `-ma4`). Both tarballs
          # extract a `rar/` directory, so unpack and rename one at a time.
          curl -fsSL --retry 3 -o "$root/unrar723.tar.gz" \
            "https://www.rarlab.com/rar/rarlinux-x64-723.tar.gz"
          curl -fsSL --retry 3 -o "$root/rar623.tar.gz" \
            "https://www.rarlab.com/rar/rarlinux-x64-623.tar.gz"
          tar -xzf "$root/unrar723.tar.gz" -C "$root"
          mv "$root/rar" "$root/rar723"
          tar -xzf "$root/rar623.tar.gz" -C "$root"
          mv "$root/rar" "$root/rar623"
          for tool in "$root/rar623/rar" "$root/rar723/unrar"; do
            if [[ ! -x "$tool" ]]; then
              echo "::error::$tool missing from the rarlab tarball"
              exit 1
            fi
          done
          {
            echo "rar=$root/rar623/rar"
            echo "unrar=$root/rar723/unrar"
            echo "sfx=$root/rar623/default.sfx"
          } >> "$GITHUB_OUTPUT"
      - name: Official rar/unrar interop tests
        if: steps.fetch.outcome == 'success'
        env:
          SA_OFFICIAL_RAR: ${{ steps.fetch.outputs.rar }}
          SA_OFFICIAL_UNRAR: ${{ steps.fetch.outputs.unrar }}
          SA_OFFICIAL_SFX: ${{ steps.fetch.outputs.sfx }}
          # A missing tool must fail the test instead of skipping it.
          SA_REQUIRE_OFFICIAL: '1'
        # --nocapture keeps the gating helpers' SKIPPED markers (and any
        # SA_REQUIRE_* assertion message) visible in the job log. The legacy
        # solid/store fallback target is gated on SA_OFFICIAL_UNRAR and
        # covered here together with the RAR5/RAR4 interop suites.
        run: >-
          cargo test -p rar-rs --locked --test official_interop --test rewrite_tests
          --test rar4_solid_store_fallback -- --nocapture
      - name: Official interop skip notice
        if: steps.fetch.outcome != 'success'
        run: echo "::warning title=Official interop skipped::rarlab console tools could not be downloaded; the official-binary suites did not run."
  build:
    name: build - ${{ matrix.settings.target }} - node@24
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            addon: rar-rs-napi.darwin-arm64.node
            build: npx napi build --platform --release --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            addon: rar-rs-napi.win32-x64-msvc.node
            build: npx napi build --platform --release --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: i686-pc-windows-msvc
            addon: rar-rs-napi.win32-ia32-msvc.node
            build: npx napi build --platform --release --target i686-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            addon: rar-rs-napi.win32-arm64-msvc.node
            build: npx napi build --platform --release --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            addon: rar-rs-napi.linux-x64-gnu.node
            build: npx napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            addon: rar-rs-napi.linux-x64-musl.node
            build: npx napi build --platform --release --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            addon: rar-rs-napi.linux-arm64-gnu.node
            build: npx napi build --platform --release --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            addon: rar-rs-napi.linux-arm64-musl.node
            build: npx napi build --platform --release --target aarch64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            addon: rar-rs-napi.linux-arm-gnueabihf.node
            build: npx napi build --platform --release --target armv7-unknown-linux-gnueabihf --use-napi-cross
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain (stable + cross target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        continue-on-error: true # transient service outages must not fail builds
        with:
          path: |
            ~/.cargo/git/db/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-${{ matrix.settings.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install zig (musl cross builds)
        if: contains(matrix.settings.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install cargo-zigbuild
        if: contains(matrix.settings.target, 'musl')
        run: |
          cargo install cargo-zigbuild --version 0.23.4 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build
        working-directory: crates/rar-napi
        run: ${{ matrix.settings.build }}
      - name: Verify native addon artifact
        working-directory: crates/rar-napi
        run: |
          set -euo pipefail
          shopt -s nullglob
          node_files=( *.node )
          if (( ${#node_files[@]} != 1 )); then
            echo "::error::expected exactly one .node file, found ${#node_files[@]}"
            printf 'found: %s\n' "${node_files[@]:-<none>}"
            exit 1
          fi
          if [[ "${node_files[0]}" != "${{ matrix.settings.addon }}" ]]; then
            echo "::error::expected ${{ matrix.settings.addon }}, found ${node_files[0]}"
            exit 1
          fi
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            crates/rar-napi/${{ matrix.settings.addon }}
            crates/rar-napi/index.js
            crates/rar-napi/index.d.ts
          if-no-files-found: error
  build-wasm:
    name: build - wasm32-wasip1-threads
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build WASM
        working-directory: crates/rar-napi
        run: npx napi build --platform --release --target wasm32-wasip1-threads
        shell: bash
      - name: Patch WASI loader for Windows host paths
        working-directory: crates/rar-napi
        run: node scripts/patch-wasi-loader.mjs
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wasm32-wasip1-threads
          path: |
            crates/rar-napi/rar-rs-napi.wasm32-wasi.wasm
            crates/rar-napi/rar-rs-napi.wasm32-wasi.debug.wasm
            crates/rar-napi/rar-rs-napi.wasi.cjs
            crates/rar-napi/rar-rs-napi.wasi.d.cts
            crates/rar-napi/rar-rs-napi.wasi-browser.js
            crates/rar-napi/wasi-path-map.cjs
            crates/rar-napi/wasi-worker.mjs
            crates/rar-napi/wasi-worker-browser.mjs
            crates/rar-napi/index.js
            crates/rar-napi/index.d.ts
          if-no-files-found: error
  test-bindings:
    name: Test bindings on ${{ matrix.settings.host }} (${{ matrix.settings.target }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            triple: win32-x64-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            triple: win32-arm64-msvc
            architecture: arm64
          - host: macos-latest
            target: aarch64-apple-darwin
            triple: darwin-arm64
            architecture: arm64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
            architecture: x64
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            triple: linux-arm64-gnu
            architecture: arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ matrix.settings.architecture }}
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/rar-napi
      - name: Verify addon filename matches loader expectation
        working-directory: crates/rar-napi
        run: |
          node -e "
          const fs = require('fs');
          const f = fs.readdirSync('.').find((n) => n.endsWith('.node'));
          if (!f) { console.error('no .node artifact'); process.exit(1); }
          const expect = 'rar-rs-napi.${{ matrix.settings.triple }}.node';
          if (f !== expect) { console.error('expected', expect, 'got', f); process.exit(1); }
          console.log('ok:', f);
          "
        shell: bash
      - name: Test addon
        working-directory: crates/rar-napi
        run: npm test
        shell: bash
  test-wasm:
    name: Test WASI binding on ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs:
      - build-wasm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Download WASI artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: crates/rar-napi
      - name: Test addon (WASI forced)
        working-directory: crates/rar-napi
        run: NAPI_RS_FORCE_WASI=error npm test
        shell: bash
  release:
    name: Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - windows-cli
      - build
      - test-bindings
      - build-wasm
      - test-wasm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify tag matches Cargo.toml and package.json versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(
            awk '
              $0 == "[package]" { in_package = 1; next }
              in_package && /^\[/ { in_package = 0 }
              in_package && /^version[[:space:]]*=/ {
                gsub(/^[^=]*=[[:space:]]*"/, "")
                gsub(/"[[:space:]]*$/, "")
                print
                exit
              }
            ' crates/rar-napi/Cargo.toml
          )"
          PACKAGE_VERSION="$(node -p "require('./crates/rar-napi/package.json').version")"
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::could not read crates/rar-napi/Cargo.toml package version"
            exit 1
          fi
          if [ "$TAG" != "$CARGO_VERSION" ] || [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag v$TAG, Cargo.toml $CARGO_VERSION, and package.json $PACKAGE_VERSION must match"
            exit 1
          fi
          echo "releasing v$TAG"
        shell: bash
      - name: Download all bindings
        uses: actions/download-artifact@v8
        with:
          path: bindings
      - name: Download WASI bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: wasm
      - name: Collect release assets
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p release

          EXPECTED_ADDONS=(
            rar-rs-napi.darwin-arm64.node
            rar-rs-napi.win32-x64-msvc.node
            rar-rs-napi.win32-ia32-msvc.node
            rar-rs-napi.win32-arm64-msvc.node
            rar-rs-napi.linux-x64-gnu.node
            rar-rs-napi.linux-x64-musl.node
            rar-rs-napi.linux-arm64-gnu.node
            rar-rs-napi.linux-arm64-musl.node
            rar-rs-napi.linux-arm-gnueabihf.node
          )
          mapfile -d '' -t NODE_FILES < <(find bindings -type f -name '*.node' -print0 | sort -z)
          if (( ${#NODE_FILES[@]} != ${#EXPECTED_ADDONS[@]} )); then
            echo "::error::expected ${#EXPECTED_ADDONS[@]} native addons, found ${#NODE_FILES[@]}"
            printf 'found: %s\n' "${NODE_FILES[@]:-<none>}"
            exit 1
          fi
          for addon in "${EXPECTED_ADDONS[@]}"; do
            mapfile -d '' -t matches < <(find bindings -type f -name "$addon" -print0 | sort -z)
            if (( ${#matches[@]} != 1 )); then
              echo "::error::expected exactly one $addon artifact, found ${#matches[@]}"
              exit 1
            fi
            cp "${matches[0]}" release/
          done

          # Every listed WASI file is part of the release contract. A missing
          # file must fail this step rather than produce a partial release.
          cp wasm/rar-rs-napi.wasm32-wasi.wasm \
             wasm/rar-rs-napi.wasm32-wasi.debug.wasm \
             wasm/rar-rs-napi.wasi.cjs \
             wasm/rar-rs-napi.wasi.d.cts \
             wasm/rar-rs-napi.wasi-browser.js \
             wasm/wasi-path-map.cjs \
             wasm/wasi-worker.mjs \
             wasm/wasi-worker-browser.mjs release/

          copy_identical_generated_file() {
            local name="$1"
            local source
            mapfile -d '' -t files < <(find bindings -type f -name "$name" -print0 | sort -z)
            if (( ${#files[@]} == 0 )); then
              echo "::error::no $name artifact was downloaded"
              exit 1
            fi
            source="${files[0]}"
            for candidate in "${files[@]:1}"; do
              if ! cmp -s "$source" "$candidate"; then
                echo "::error::$name differs between $source and $candidate"
                exit 1
              fi
            done
            cp "$source" "release/$name"
          }
          copy_identical_generated_file index.js
          copy_identical_generated_file index.d.ts

          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md release/

          mapfile -d '' -t LICENSE_FILES < <(find LICENSES -type f -print0 | sort -z)
          if (( ${#LICENSE_FILES[@]} == 0 )); then
            echo "::error::no identified license-family texts found under LICENSES/"
            exit 1
          fi
          for file in "${LICENSE_FILES[@]}"; do
            relative="${file#LICENSES/}"
            flattened="${relative//\//__}"
            destination="release/THIRD_PARTY_LICENSE-$flattened"
            if [[ -e "$destination" ]]; then
              echo "::error::flattened license filename collision: $destination"
              exit 1
            fi
            cp "$file" "$destination"
          done

          # Write outside release/ so SHA-256SUMS can never hash itself.
          (cd release && sha256sum *) > SHA-256SUMS.tmp
          mv SHA-256SUMS.tmp release/SHA-256SUMS
          ls -la release/
        shell: bash
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/* 2>&1 || \
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
