name: CI
env:
  DEBUG: napi:*
  APP_NAME: rar-rs-napi
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  # Static musl addons are cross-built with cargo-zigbuild, which needs a
  # `zig`. Pinned here (not by an action) and verified against the SHA-256
  # from ziglang.org's own index: the download stays on the official host,
  # and the checksum makes a corrupted or substituted tarball a hard error.
  # 0.16.0 is the current stable, validated locally by building the musl
  # addon and running the whole JS suite against it. (An earlier run of this
  # workflow failed *after* installing 0.16.0, which was a missing PATH export
  # in the installer, not the version.)
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  CARGO_ZIGBUILD_VERSION: '0.23.4'
  # Release-grade work — the binding matrix builds and rustdoc — runs on tags
  # and manual dispatches. A push/PR keeps only what catches a broken change
  # fast: fmt, the host-path guard, cargo check/clippy and cargo-deny.
  #
  # Tests are NOT run here: they are a local gate (`cargo test --workspace
  # --all-features`, see docs/testing.md). The owner asked for that in
  # 2026-09 after the WASI binding suite blocked a release on a
  # non-reproducible `memory access out of bounds`; a red CI run is now a
  # compile/lint failure, never a test flake.
  RUN_HEAVY: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
      - '**/*.gitignore'
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The rar-rs workspace ships a pure-Rust library (crates/rar), CLI
# (crates/rar-cli) and the rar-rs-napi binding
# (crates/rar-napi, native .node + wasm32-wasip1-threads). No npm package
# is published: the VS Code consumer downloads the compiled artifacts from
# the GitHub Release assets (tag v*), SHA-256 pinned in its installer —
# every release ships a SHA-256SUMS manifest for that.
# The binding's JS tests run with `node --test` under crates/rar-napi; they are
# a local gate, like the Rust suites.
#
# Trigger split (see `RUN_HEAVY`): every push/PR runs `lint`; tags and manual
# dispatches additionally build the binding matrix and check rustdoc.
# `release` (tags only) assembles the GitHub Release from those artifacts.
#
# This file must live at the repository ROOT: GitHub Actions only executes
# .github/workflows/*.yml from the default branch root; the old copy under
# crates/rar-napi/.github/workflows/ was never run.
jobs:
  lint:
    name: Lint + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        if: env.RUN_HEAVY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads
      - name: Cargo fmt (workspace)
        run: cargo fmt --all --check
      - name: Host-path separator guard
        # Host paths (disk, destination directory, volumes, -w/-op/--dest)
        # must test separators through `std::path::is_separator`, which is
        # platform-correct: `/` everywhere, `\` only on Windows. A literal
        # `ends_with('\\')` is a Windows-only assumption that made
        # `rar x p.rar dest\` create a literal `dest\` directory on Linux.
        # Archive-member names may still normalize `\` -> `/` (RAR stores
        # backslashes), so only the method-on-char-literal shape is guarded.
        run: |
          set -euo pipefail
          printf "ends_with('%s')\nstarts_with('%s')\n" '\\' '\\' > /tmp/host-sep-patterns
          if grep -rnFf /tmp/host-sep-patterns --include='*.rs' crates/rar-cli/src crates/rar/src; then
            echo "::error::host paths must use std::path::is_separator, not a literal backslash check"
            exit 1
          fi
      - name: Cargo check (workspace defaults)
        run: cargo check --workspace --all-targets --locked
      - name: Cargo check (rar-rs, no default features)
        run: cargo check -p rar-rs --no-default-features --locked
      - name: Cargo check (rar-rs, wasm target, -D warnings)
        # The binding's wasm build only runs in the heavy matrix, which does not
        # deny warnings, so wasm-only dead code (helpers gated to unix/windows)
        # went unnoticed. The toolchain install above already adds the target.
        env:
          RUSTFLAGS: -D warnings
        run: cargo check -p rar-rs --all-features --target wasm32-wasip1-threads --locked
      - name: Workspace versions agree
        # The release job only compares the tag against `crates/rar-napi`, so the
        # library and CLI drifted (0.1.2 vs the binding's 0.7.0). Everything here
        # ships from one tree, so hold all four files to the same version.
        run: |
          set -euo pipefail
          version() {
            sed -n '/^\[package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p}' "$1" | head -1
          }
          lib=$(version crates/rar/Cargo.toml)
          cli=$(version crates/rar-cli/Cargo.toml)
          napi=$(version crates/rar-napi/Cargo.toml)
          pkg=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' \
            crates/rar-napi/package.json | head -1)
          printf 'rar-rs=%s rar-cli=%s rar-rs-napi=%s package.json=%s\n' \
            "$lib" "$cli" "$napi" "$pkg"
          if [ -z "$lib" ] || [ "$lib" != "$cli" ] || [ "$lib" != "$napi" ] \
            || [ "$lib" != "$pkg" ]; then
            echo "::error::library, CLI, binding and package.json versions must match"
            exit 1
          fi
        shell: bash
      - name: Cargo check (fuzz workspace)
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - name: Cargo fmt (fuzz workspace)
        # `fuzz/` is not a workspace member, so `cargo fmt --all` never
        # covers its targets.
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Cargo check (fuzz workspace, libFuzzer feature)
        # libfuzzer-sys compiles on stable (only `cargo fuzz` itself needs
        # nightly, for `-Z sanitizer`), so the `fuzzing` codepaths are
        # compiled on every run instead of only in the manual libFuzzer mode.
        # `--cfg fuzzing` is the switch cargo-fuzz sets; without it the
        # targets fall back to their standalone `main` and the
        # `fuzz_target!` entry points are never type-checked.
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --features fuzzing --locked
      - name: Clippy (workspace, all features and targets)
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Clippy (rar-rs, every feature combination)
        # The workspace build unifies features across crates (rar-rs-napi
        # pulls in parallel + simd), which hides targets that use a gated API
        # without declaring `required-features` for it — the mtwin example
        # failed `cargo check -p rar-rs --all-targets` for that reason while
        # the workspace check stayed green. Check the library on its own so
        # each combination is seen in isolation.
        run: |
          set -euo pipefail
          for f in "" parallel simd parallel,simd; do
            echo "::group::features='$f'"
            cargo clippy -p rar-rs --no-default-features --features "$f" --all-targets --locked -- -D warnings
            echo "::endgroup::"
          done
        shell: bash
      - name: Dependency advisories, licenses and sources
        # `cargo clippy` checks this tree; this checks the crates it pulls in:
        # RustSec advisories, the license allow-list and the registry sources,
        # all against the lockfile. The configuration and the rationale for
        # each allowed license family live in the root `deny.toml`.
        #
        # `arguments` is prepended before the `check` subcommand by the
        # action, so only the global flags belong there; `--all-features`
        # matches the clippy step's feature set and `--locked` holds the
        # check to the committed lockfile.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --locked
      - name: Cargo doc (workspace)
        if: env.RUN_HEAVY == 'true'
        # `-D warnings` catches broken intra-doc links and malformed docs.
        # The tree is clean today (the old note about public docs linking to
        # private internals no longer applies), so treat any new warning as a
        # failure instead of silently publishing it.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Install binding dependencies
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build addon (native)
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: npx napi build --platform --release
      - name: Build WASM addon
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: npx napi build --platform --release --target wasm32-wasip1-threads
      - name: Patch WASI loader for Windows host paths
        if: env.RUN_HEAVY == 'true'
        working-directory: crates/rar-napi
        run: node scripts/patch-wasi-loader.mjs
  build:
    name: build - ${{ matrix.settings.target }} - node@24
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            addon: rar-rs-napi.darwin-arm64.node
            build: npx napi build --platform --release --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            addon: rar-rs-napi.win32-x64-msvc.node
            build: npx napi build --platform --release --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: i686-pc-windows-msvc
            addon: rar-rs-napi.win32-ia32-msvc.node
            build: npx napi build --platform --release --target i686-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            addon: rar-rs-napi.win32-arm64-msvc.node
            build: npx napi build --platform --release --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            addon: rar-rs-napi.linux-x64-gnu.node
            build: npx napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            addon: rar-rs-napi.linux-x64-musl.node
            build: npx napi build --platform --release --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            addon: rar-rs-napi.linux-arm64-gnu.node
            build: npx napi build --platform --release --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            addon: rar-rs-napi.linux-arm64-musl.node
            build: npx napi build --platform --release --target aarch64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            addon: rar-rs-napi.linux-arm-gnueabihf.node
            build: npx napi build --platform --release --target armv7-unknown-linux-gnueabihf --use-napi-cross
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: x64
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain (stable + cross target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        continue-on-error: true # transient service outages must not fail builds
        with:
          path: |
            ~/.cargo/git/db/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-${{ matrix.settings.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache zig and cargo-zigbuild
        if: contains(matrix.settings.target, 'musl')
        # The ziglang.org download is the slow part of the two musl jobs, so the
        # unpacked toolchain is cached and the download happens once per version.
        # `cargo install cargo-zigbuild` compiles from source, so its binary is
        # cached too.
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/zig
            /usr/local/cargo/bin/cargo-zigbuild
            ~/.cargo/bin/cargo-zigbuild
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: Install zig (musl cross builds)
        if: contains(matrix.settings.target, 'musl')
        timeout-minutes: 60
        env:
          ZIG_HOME: ${{ runner.temp }}/zig
        run: bash scripts/ci/install-zig.sh
      - name: Install cargo-zigbuild
        if: contains(matrix.settings.target, 'musl')
        run: bash scripts/ci/install-cargo-zigbuild.sh
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build
        working-directory: crates/rar-napi
        run: ${{ matrix.settings.build }}
      - name: Verify native addon artifact
        working-directory: crates/rar-napi
        run: |
          set -euo pipefail
          shopt -s nullglob
          node_files=( *.node )
          if (( ${#node_files[@]} != 1 )); then
            echo "::error::expected exactly one .node file, found ${#node_files[@]}"
            printf 'found: %s\n' "${node_files[@]:-<none>}"
            exit 1
          fi
          if [[ "${node_files[0]}" != "${{ matrix.settings.addon }}" ]]; then
            echo "::error::expected ${{ matrix.settings.addon }}, found ${node_files[0]}"
            exit 1
          fi
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            crates/rar-napi/${{ matrix.settings.addon }}
            crates/rar-napi/index.js
            crates/rar-napi/index.d.ts
          if-no-files-found: error
  build-wasm:
    name: build - wasm32-wasip1-threads
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/rar-napi/package-lock.json
      - name: Install rust toolchain (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads
      - name: Install dependencies
        working-directory: crates/rar-napi
        run: npm ci
      - name: Build WASM
        working-directory: crates/rar-napi
        run: npx napi build --platform --release --target wasm32-wasip1-threads
        shell: bash
      - name: Patch WASI loader for Windows host paths
        working-directory: crates/rar-napi
        run: node scripts/patch-wasi-loader.mjs
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wasm32-wasip1-threads
          path: |
            crates/rar-napi/rar-rs-napi.wasm32-wasi.wasm
            crates/rar-napi/rar-rs-napi.wasm32-wasi.debug.wasm
            crates/rar-napi/rar-rs-napi.wasi.cjs
            crates/rar-napi/rar-rs-napi.wasi.d.cts
            crates/rar-napi/rar-rs-napi.wasi-browser.js
            crates/rar-napi/wasi-path-map.cjs
            crates/rar-napi/wasi-worker.mjs
            crates/rar-napi/wasi-worker-browser.mjs
            crates/rar-napi/index.js
            crates/rar-napi/index.d.ts
          if-no-files-found: error
  release:
    name: Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - build
      - build-wasm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify tag matches Cargo.toml and package.json versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(
            awk '
              $0 == "[package]" { in_package = 1; next }
              in_package && /^\[/ { in_package = 0 }
              in_package && /^version[[:space:]]*=/ {
                gsub(/^[^=]*=[[:space:]]*"/, "")
                gsub(/"[[:space:]]*$/, "")
                print
                exit
              }
            ' crates/rar-napi/Cargo.toml
          )"
          PACKAGE_VERSION="$(node -p "require('./crates/rar-napi/package.json').version")"
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::could not read crates/rar-napi/Cargo.toml package version"
            exit 1
          fi
          if [ "$TAG" != "$CARGO_VERSION" ] || [ "$TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag v$TAG, Cargo.toml $CARGO_VERSION, and package.json $PACKAGE_VERSION must match"
            exit 1
          fi
          echo "releasing v$TAG"
        shell: bash
      - name: Download all bindings
        uses: actions/download-artifact@v8
        with:
          path: bindings
      - name: Download WASI bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: wasm
      - name: Collect release assets
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p release

          EXPECTED_ADDONS=(
            rar-rs-napi.darwin-arm64.node
            rar-rs-napi.win32-x64-msvc.node
            rar-rs-napi.win32-ia32-msvc.node
            rar-rs-napi.win32-arm64-msvc.node
            rar-rs-napi.linux-x64-gnu.node
            rar-rs-napi.linux-x64-musl.node
            rar-rs-napi.linux-arm64-gnu.node
            rar-rs-napi.linux-arm64-musl.node
            rar-rs-napi.linux-arm-gnueabihf.node
          )
          mapfile -d '' -t NODE_FILES < <(find bindings -type f -name '*.node' -print0 | sort -z)
          if (( ${#NODE_FILES[@]} != ${#EXPECTED_ADDONS[@]} )); then
            echo "::error::expected ${#EXPECTED_ADDONS[@]} native addons, found ${#NODE_FILES[@]}"
            printf 'found: %s\n' "${NODE_FILES[@]:-<none>}"
            exit 1
          fi
          for addon in "${EXPECTED_ADDONS[@]}"; do
            mapfile -d '' -t matches < <(find bindings -type f -name "$addon" -print0 | sort -z)
            if (( ${#matches[@]} != 1 )); then
              echo "::error::expected exactly one $addon artifact, found ${#matches[@]}"
              exit 1
            fi
            cp "${matches[0]}" release/
          done

          # Every listed WASI file is part of the release contract. A missing
          # file must fail this step rather than produce a partial release.
          cp wasm/rar-rs-napi.wasm32-wasi.wasm \
             wasm/rar-rs-napi.wasm32-wasi.debug.wasm \
             wasm/rar-rs-napi.wasi.cjs \
             wasm/rar-rs-napi.wasi.d.cts \
             wasm/rar-rs-napi.wasi-browser.js \
             wasm/wasi-path-map.cjs \
             wasm/wasi-worker.mjs \
             wasm/wasi-worker-browser.mjs release/

          copy_identical_generated_file() {
            local name="$1"
            local source
            mapfile -d '' -t files < <(find bindings -type f -name "$name" -print0 | sort -z)
            if (( ${#files[@]} == 0 )); then
              echo "::error::no $name artifact was downloaded"
              exit 1
            fi
            source="${files[0]}"
            for candidate in "${files[@]:1}"; do
              if ! cmp -s "$source" "$candidate"; then
                echo "::error::$name differs between $source and $candidate"
                exit 1
              fi
            done
            cp "$source" "release/$name"
          }
          copy_identical_generated_file index.js
          copy_identical_generated_file index.d.ts

          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md release/

          mapfile -d '' -t LICENSE_FILES < <(find LICENSES -type f -print0 | sort -z)
          if (( ${#LICENSE_FILES[@]} == 0 )); then
            echo "::error::no identified license-family texts found under LICENSES/"
            exit 1
          fi
          for file in "${LICENSE_FILES[@]}"; do
            relative="${file#LICENSES/}"
            flattened="${relative//\//__}"
            destination="release/THIRD_PARTY_LICENSE-$flattened"
            if [[ -e "$destination" ]]; then
              echo "::error::flattened license filename collision: $destination"
              exit 1
            fi
            cp "$file" "$destination"
          done

          # Write outside release/ so SHA-256SUMS can never hash itself.
          (cd release && sha256sum *) > SHA-256SUMS.tmp
          mv SHA-256SUMS.tmp release/SHA-256SUMS
          ls -la release/
        shell: bash
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/* 2>&1 || \
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
