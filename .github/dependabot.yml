# Version drift is the failure mode this repo actually hit: the WinRAR cache
# step sat on `actions/cache@v4` while the build matrix had moved to `v6`, and
# nothing flagged it. Dependabot keeps the Actions majors moving with one
# grouped PR.
#
# Cargo is on a monthly, minor/patch-only group: the lockfile is part of the
# release contract (`Cargo.lock` is committed and every CI check is
# `--locked`), so a weekly bump PR would be noise, while a security-relevant
# crate update still arrives on its own before the monthly group. Dependabot
# does not know about `rust-version`, so a bump that raises the floor shows up
# as a red `msrv` job rather than as a silent MSRV change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
