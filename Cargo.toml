[package]
name = "rar5"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust RAR5 archive library — create, read, and extract RAR5 archives with native LZSS+Huffman compression"
license = "BSD-2-Clause"
repository = "https://codeberg.org/librar/rar-rs"

[[bin]]
name = "rar"
path = "src/bin/rar.rs"

[[bin]]
name = "unrar"
path = "src/bin/unrar.rs"

[dependencies]
crc32fast = "1"
aes = { version = "0.9", features = ["zeroize"] }
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"
zeroize = { version = "1.9", features = ["alloc", "derive"] }
rayon = { version = "1.12", optional = true }
wide = { version = "0.8", optional = true }
memchr = { version = "2.8", optional = true }

[features]
default = []
parallel = ["dep:rayon"]
simd = ["dep:wide", "dep:memchr"]

[dev-dependencies]
tempfile = "3"
