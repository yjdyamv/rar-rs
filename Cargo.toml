[workspace]
members = ["crates/rar", "crates/rar-cli", "crates/rar-napi"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
repository = "https://codeberg.org/librar/rar-rs"
description = "Pure-Rust RAR5 archive library — create, read, and extract RAR5 archives with native LZSS+Huffman compression"

[workspace.dependencies]
crc32fast = "1"
aes = { version = "0.9", features = ["zeroize"] }
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
zeroize = { version = "1.9", features = ["alloc", "derive"] }
rayon = "1.12"
wide = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Registry"] }
rar5 = { path = "crates/rar" }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Shared release profile (binding .node binaries and CLI releases): LTO +
# symbol stripping keep artifacts small; overridden per-crate if needed.
[profile.release]
lto = true
strip = "symbols"
