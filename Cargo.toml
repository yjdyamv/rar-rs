[workspace]
members = ["crates/rar", "crates/rar-cli", "crates/rar-napi"]
# Resolver 3 (edition 2024 generation): dev-dependency features no longer
# leak into normal builds.
#
# Note for Windows: the binding crate builds for an **MSVC** target (Node
# itself is MSVC-built and `napi-build` does nothing there), while its
# `windows-gnu` path insists on a `libnode.dll` in `LIBNODE_PATH` / `LIBPATH` /
# `PATH` that no Node distribution ships. A host whose rustup default is
# `x86_64-pc-windows-gnu` therefore has to select the MSVC one
# (`rustup default stable-x86_64-pc-windows-msvc`, or `--target` per command),
# or a workspace-wide `cargo build` fails in the binding's build script.
resolver = "3"

[workspace.package]
edition = "2024"
# The project's own contributions are BSD-2-Clause (LICENSE). Portions ported
# from other projects keep their own terms and are documented in NOTICE and
# THIRD_PARTY_LICENSES.md rather than folded into this field, so a
# redistributor has to read those as well.
license = "BSD-2-Clause"
repository = "https://codeberg.org/librar/rar-rs"
description = "Pure-Rust library and tools for RAR 1.5-4.x, RAR5, and RAR7 archives"

[workspace.dependencies]
crc32fast = "1"
aes = { version = "0.9", features = ["zeroize"] }
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"
rand = "0.10"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
zeroize = { version = "1.9", features = ["alloc", "derive"] }
rayon = "1.12"
wide = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_Globalization"] }
libc = "0.2"
# `version` is required for `cargo package`/`publish` of the dependents
# (rar-cli, rar-napi); the path is what local builds use. Keep it equal to
# crates/rar's version: `cargo package` refuses a mismatch, and the release tag
# is checked against crates/rar-napi.
rar-rs = { version = "0.12.0", path = "crates/rar" }

[workspace.lints.rust]
unused_must_use = "deny"
# MSVC's link.exe writes its "Creating library ..." notice to stdout, which
# `linker_messages` surfaces as a warning on every cdylib build (only
# rar-rs-napi exports one; harmless elsewhere).
linker_messages = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Test profile: the compression paths (match finding, PPMd, AES) are pure CPU
# work and run an order of magnitude slower unoptimized, which put the full
# suite past eight minutes of test execution. Optimizing test targets only —
# `cargo build` keeps the debug profile — while still inheriting
# `debug_assertions` and `overflow-checks` from `dev`, so arithmetic panics
# and `debug_assert!` keep firing exactly as before.
[profile.test]
opt-level = 2

# Shared release profile (binding .node binaries and CLI releases): LTO +
# symbol stripping keep artifacts small; overridden per-crate if needed.
[profile.release]
lto = true
strip = "symbols"
