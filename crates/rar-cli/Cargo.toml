[package]
name = "rar-cli"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WinRAR-compatible command-line tools (rar, unrar)"

[[bin]]
name = "rar"
path = "src/bin/rar/main.rs"

[[bin]]
name = "unrar"
path = "src/bin/unrar.rs"

[dependencies]
rar-rs = { workspace = true, features = ["parallel"] }
clap = { workspace = true }
crc32fast = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = "3"
sha2.workspace = true

[lints]
workspace = true

