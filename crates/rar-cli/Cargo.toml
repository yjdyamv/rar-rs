[package]
name = "rar-cli"
version = "0.12.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WinRAR-compatible command-line tools (rar, unrar)"
readme = "../../README.md"
documentation = "https://docs.rs/rar-cli"
keywords = ["rar", "unrar", "archive", "cli", "extract"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "rar"
path = "src/bin/rar/main.rs"

[[bin]]
name = "unrar"
path = "src/bin/unrar.rs"

[dependencies]
rar-rs = { workspace = true, features = ["parallel"] }
clap = { workspace = true }
crc32fast = { workspace = true }
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
sha2.workspace = true

[lints]
workspace = true

