[package]
name = "rar-rs"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
crc32fast = { workspace = true }
aes = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
windows-sys = { workspace = true }
rayon = { workspace = true, optional = true }
wide = { workspace = true, optional = true }

[features]
default = []
# Opt-in to the low-level wire surface: the `format` tree and its `rar40` /
# `rar50` aliases. Off by default — those helpers are not part of the
# supported API and are kept only for downstream raw access, plus the
# in-tree tests that assert wire-level compatibility.
raw = []
parallel = ["dep:rayon"]
simd = ["dep:wide"]

[dev-dependencies]
tempfile = "3"
# The wire-level surface (`format` tree, `rar40`/`rar50` aliases) is hidden
# behind the `raw` feature, but the in-tree tests still cross that seam on
# purpose — re-implementing the block envelope in `tests/support` would be a
# second, drifting copy of the format. Depending on ourselves with `raw`
# turns the feature on for the dev/test graph only, so downstream users keep
# the clean default surface.
rar-rs = { path = ".", features = ["raw"] }


[lints]
workspace = true

[[example]]
name = "mtbench"
required-features = ["parallel"]

[[example]]
name = "ratiocheck"
required-features = ["parallel"]

[[example]]
name = "mtprobe"
required-features = ["parallel"]

[[example]]
name = "clioverhead"
required-features = ["parallel"]

[[example]]
name = "collectbench"
required-features = ["parallel"]

# Uses `EncoderState` / `encode_chunked_mt`, both `parallel`-gated.
[[example]]
name = "mtwin"
required-features = ["parallel"]

