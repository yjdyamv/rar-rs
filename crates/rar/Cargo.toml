[package]
name = "rar-rs"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rar-rs"
keywords = ["rar", "archive", "compression", "extract"]
categories = ["compression", "encoding"]

[dependencies]
crc32fast = { workspace = true }
aes = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
windows-sys = { workspace = true }
rayon = { workspace = true, optional = true }
wide = { workspace = true, optional = true }

[features]
default = []
parallel = ["dep:rayon"]
simd = ["dep:wide"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "mtbench"
required-features = ["parallel"]

[[example]]
name = "ratiocheck"
required-features = ["parallel"]

[[example]]
name = "mtprobe"
required-features = ["parallel"]

[[example]]
name = "clioverhead"
required-features = ["parallel"]

[[example]]
name = "collectbench"
required-features = ["parallel"]

# Uses `EncoderState` / `encode_chunked_mt`, both `parallel`-gated.
[[example]]
name = "mtwin"
required-features = ["parallel"]


