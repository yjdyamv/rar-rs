[package]
name = "rar-rs"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
crc32fast = { workspace = true }
aes = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
windows-sys = { workspace = true }
rayon = { workspace = true, optional = true }
wide = { workspace = true, optional = true }

[features]
default = []
# Opt-in to the legacy container's low-level wire surface (`rar_rs::rar40`).
# Off by default: the RAR4 wire helpers have no in-tree users and are kept
# only for downstream raw access until the breaking release removes them.
raw = []
parallel = ["dep:rayon"]
simd = ["dep:wide"]

[dev-dependencies]
tempfile = "3"


[lints]
workspace = true

[[example]]
name = "mtbench"
required-features = ["parallel"]

[[example]]
name = "ratiocheck"
required-features = ["parallel"]

[[example]]
name = "mtprobe"
required-features = ["parallel"]
