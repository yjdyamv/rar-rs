[package]
name = "rar-rs-napi"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
description = "RAR archive toolkit — napi-rs bindings for creating, reading, extracting, modifying, and repairing archives"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
rar-rs = { workspace = true, features = ["parallel", "simd"] }

[build-dependencies]
napi-build = "2"

[lints.rust]
# MSVC's link.exe writes its "Creating library ..." notice to stdout; the
# linker_messages lint surfaces that as a warning on every DLL build. The
# message is informational, so silence the lint (scoped to this crate, the
# only one that exports a cdylib).
linker_messages = "allow"
