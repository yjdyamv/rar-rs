[package]
name = "rar-rs-napi"
version = "0.7.0"
edition.workspace = true
description = "RAR archive toolkit — napi-rs bindings for creating, reading, extracting, modifying, and repairing archives"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
rar-rs = { workspace = true, features = ["parallel", "simd"] }

[build-dependencies]
napi-build = "2"

[lints]
# Inherit the workspace lint set (unused_must_use = deny, the clippy
# dbg/todo/unimplemented set, and the workspace-wide `linker_messages` allow
# that exists for this crate's cdylib build).
workspace = true

