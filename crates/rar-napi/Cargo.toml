[package]
name = "smart-archive-rar"
version = "0.5.0"
edition = "2021"
description = "RAR5 archive creation for Smart Archive — napi-rs binding around the rar5 library"
license = "BSD-2-Clause"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
rar5 = { path = "../rar", features = ["parallel", "simd"] }

[build-dependencies]
napi-build = "2"

[lints.rust]
# MSVC's link.exe writes its "Creating library ..." notice to stdout; the
# linker_messages lint surfaces that as a warning on every DLL build. The
# message is informational, so silence the lint (scoped to this crate, the
# only one that exports a cdylib).
linker_messages = "allow"
